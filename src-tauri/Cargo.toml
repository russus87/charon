[package]
name = "charon"
version = "0.2.1"
description = "Charon - dump, import e clonazione di database (PostgreSQL, Oracle, SQL Server)"
authors = ["Antonio Russo"]
license = "MIT"
repository = "https://github.com/russus87/charon"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "charon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Il binario dell'app desktop si chiama `charon-desktop` per non collidere con la
# CLI `charon` (crate `cli/`) nello stesso `target/`. Il nome-prodotto resta
# "Charon" (vedi tauri.conf.json → productName/mainBinaryName): invisibile all'utente.
[[bin]]
name = "charon-desktop"
path = "src/main.rs"

[features]
# Supporto Oracle puro-Rust (crate `oracle`/ODPI-C). NON di default per tenere
# veloce la build di sviluppo. Le release lo attivano (vedi release.yml / PKGBUILD):
# compilarlo NON richiede l'Instant Client, che serve solo a runtime. Cosi' il
# cliente riceve il binario gia' pronto e deve solo installare l'Instant Client.
oracle = ["charon-core/oracle-driver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
# La logica vera (dump/import/clone) vive nel crate "core".
charon-core = { path = "../core" }
