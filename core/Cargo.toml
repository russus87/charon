# Crate "core": tutta la logica di dump/import/clone dei database, in Rust puro
# (niente Tauri). Strategia IBRIDA: se i tool nativi (pg_dump, sqlcmd, expdp, ...)
# sono presenti vengono usati quelli; altrimenti si tenta un fallback puro Rust
# tramite i driver (best-effort). Vedi README per i dettagli.
[package]
name = "charon-core"
version = "0.3.0"
edition = "2021"

[features]
# Fallback puro Rust (Postgres/SQL Server/Oracle) e tunnel SSH: attivi di default.
# Oracle incluso: compilarlo non richiede l'Instant Client (serve solo a runtime),
# quindi anche la build di sviluppo mostra Oracle fra i motori disponibili.
default = ["pg-driver", "mssql-driver", "ssh-tunnel", "oracle-driver", "sqlite-driver", "mysql-driver"]
pg-driver = ["dep:tokio-postgres"]
mssql-driver = ["dep:tiberius", "dep:tokio-util", "dep:futures-util"]
# Fallback puro Rust per MySQL/MariaDB (crate `mysql`, sincrono come rusqlite).
# Niente TLS ne' zlib di sistema: solo backend puro Rust (minimal-rust), cosi'
# non serve openssl ne' un compilatore C per la compressione.
mysql-driver = ["dep:mysql"]
# Tunnel SSH puro Rust (nessun binario ssh esterno richiesto).
ssh-tunnel = ["dep:russh"]
# Il driver Oracle (crate `oracle`/ODPI-C). COMPILARLO non richiede l'Instant
# Client (ODPI-C lo carica con dlopen a RUNTIME): quindi e' attivabile anche in
# CI. Off di default solo per tenere veloce la build di sviluppo; le release lo
# attivano via la feature `oracle` del crate Tauri. A runtime serve l'Instant
# Client, altrimenti la UI mostra le istruzioni per installarlo.
# Include anche l'estrazione dello zip Instant Client (comando `oracle-setup`).
oracle-driver = ["dep:oracle", "dep:zip"]
# Fallback puro Rust per SQLite. `bundled` compila SQLite dentro il binario:
# nessuna libreria di sistema richiesta, coerente con la filosofia no-admin.
sqlite-driver = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Runtime asincrono usato dai driver del fallback puro Rust.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util"] }

# --- Fallback puro Rust: PostgreSQL ---
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }

# --- Fallback puro Rust: SQL Server (driver TDS puro Rust) ---
tiberius = { version = "0.12", optional = true, default-features = false, features = ["rustls", "tds73"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
futures-util = { version = "0.3", optional = true }

# --- Fallback Oracle (opzionale, richiede Instant Client) ---
oracle = { version = "0.6", optional = true }
# Estrazione dell'Instant Client da .zip (solo deflate: formato degli zip Oracle).
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

# --- Tunnel SSH puro Rust ---
russh = { version = "0.54", optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"], optional = true }

# --- Fallback puro Rust: MySQL/MariaDB (client sincrono, come rusqlite) ---
# default-features=false + minimal-rust: niente TLS e compressione con backend
# puro Rust (nessuna dipendenza da zlib/openssl di sistema).
mysql = { version = "28", optional = true, default-features = false, features = ["minimal-rust", "derive", "buffer-pool"] }

[dev-dependencies]
tempfile = "3"
