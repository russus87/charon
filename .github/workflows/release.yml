# Compila e pubblica i pacchetti desktop per Linux, Windows e macOS.
# Si attiva quando spingi un tag tipo v0.1.0 (oppure manualmente da GitHub).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Mac Apple Silicon (M1-M5). Niente build Intel.
            args: "--target aarch64-apple-darwin --features oracle"
            ic_url: ""                  # IC macOS è .dmg (non zip) → per ora usa oracle-setup
          - platform: ubuntu-22.04      # Linux (.deb, .rpm, .AppImage)
            args: "--features oracle"
            ic_url: "https://download.oracle.com/otn_software/linux/instantclient/2326200v2/instantclient-basiclite-linux.x64-23.26.2.0.0.zip"
          - platform: windows-latest    # Windows (.exe NSIS, .msi)
            args: "--features oracle"
            ic_url: "https://download.oracle.com/otn_software/nt/instantclient/2326200/instantclient-basiclite-windows.x64-23.26.2.0.0.zip"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Dipendenze di sistema (solo Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Installa dipendenze frontend
        run: npm install

      # Scarica l'Oracle Instant Client "Basic Lite" per l'OS e lo mette tra le
      # risorse del bundle (tauri.conf.json -> bundle.resources): a runtime Charon
      # lo scompatta e aggancia da solo (zero setup). NB: uno zip per ogni OS.
      - name: Oracle Instant Client (bundle nelle risorse)
        if: matrix.ic_url != ''
        shell: bash
        run: |
          mkdir -p src-tauri/resources/oracle
          curl -sSL -A "Mozilla/5.0" -o src-tauri/resources/oracle/instantclient.zip "${{ matrix.ic_url }}"
          echo "Instant Client scaricato:"; ls -lh src-tauri/resources/oracle/

      # --features oracle: include il driver Oracle (ODPI-C, C vendored). Compilarlo
      # NON richiede l'Instant Client, che serve solo a runtime lato utente.
      - name: Build + bundle + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Charon ${{ github.ref_name }}"
          releaseDraft: false
          releaseBody: "Pacchetti generati automaticamente. .pkg.tar.zst per Arch Linux."
          args: ${{ matrix.args }}

  # --- Arch Linux: pacchetto nativo .pkg.tar.zst via makepkg ---
  arch:
    runs-on: ubuntu-latest
    needs: build              # la release (draft) esiste gia', creata dal job build
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
      - name: Strumenti base nel container
        run: pacman -Syu --noconfirm git nodejs npm rust base-devel webkit2gtk-4.1 gtk3 librsvg sudo curl

      - uses: actions/checkout@v4

      # Scarica il Basic Lite Linux nelle risorse: il PKGBUILD lo installa poi in
      # /usr/lib/charon/resources/oracle/, dove Charon lo aggancia a runtime.
      - name: Oracle Instant Client (bundle nel .pkg.tar.zst)
        run: |
          mkdir -p src-tauri/resources/oracle
          curl -sSL -A "Mozilla/5.0" -o src-tauri/resources/oracle/instantclient.zip \
            "https://download.oracle.com/otn_software/linux/instantclient/2326200v2/instantclient-basiclite-linux.x64-23.26.2.0.0.zip"

      - name: Inietta la versione dal tag nel PKGBUILD
        run: |
          VER="${GITHUB_REF_NAME#v}"        # v0.1.0 -> 0.1.0
          sed -i "s/^pkgver=.*/pkgver=${VER}/" packaging/PKGBUILD
          echo "Versione pacchetto: ${VER}"

      - name: Build del pacchetto (makepkg non gira da root)
        run: |
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder bash -c 'cd packaging && makepkg -f --noconfirm --nodeps'

      - name: Carica il .pkg.tar.zst nella release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: packaging/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
